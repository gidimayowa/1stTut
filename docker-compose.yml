version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: xr_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/xr_research
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
